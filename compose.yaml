services:
  wasmdock:
    build: .
    ports:
      - "127.0.0.1:8020:8020"
    volumes:
      - wasmdock-data:/app/.data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 2
volumes:
  wasmdock-data:
